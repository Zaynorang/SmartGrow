[platformio]
default_envs = esp32-local

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  adafruit/DHT sensor library@1.4.6
  adafruit/Adafruit Unified Sensor@1.1.15
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.11.0
  claws/BH1750@1.3.0
  marcoschwartz/LiquidCrystal_I2C@1.1.4
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@6.21.5

; First hardware test: no VPS, MQTT, account, or device_config.h required.
[env:esp32-local]
build_flags = -D SMARTGROW_LOCAL_TEST=1

; Production: requires a unique provisioned device_config.h.
[env:esp32dev]
build_flags = -D SMARTGROW_LOCAL_TEST=0
